# dsf's default workflow, except for verify, so the factory can work on
# dsf itself. Verify reaches crates.io through the egress proxy to fetch
# crates, which needs `index.crates.io` and `static.crates.io` in the host's
# [egress] allow. Each verify starts from a fresh copy of the tree, so it is
# a cold build every time: about 3.5 minutes on two fast CPUs, so the
# default 30-minute timeout leaves room for slower hosts.
version = 1
start = "plan"

[stages.plan]
kind = "agent"
mode = "read"
prompt = "plan.md.j2"
schema = "plan"
on = { ready = "approve", needs_decision = "@blocked" }

[stages.approve]
kind = "gate"
on = { approved = "implement", rejected = "@blocked" }

[stages.implement]
kind = "agent"
mode = "write"
prompt = "implement.md.j2"
on = { success = "verify", failure = "@blocked" }

[stages.verify]
kind = "command"
run = ".factory/verify.sh"
timeout = "30m"
network = "proxy"
max_visits = 5
on = { success = "review", failure = "fix" }

[stages.fix]
kind = "agent"
mode = "write"
prompt = "fix.md.j2"
max_visits = 3
on = { success = "verify", failure = "@blocked" }

[stages.review]
kind = "agent"
mode = "read"
prompt = "review.md.j2"
schema = "review"
max_visits = 2
on = { approve = "@publish", changes_requested = "fix" }
exhausted = "@publish"
