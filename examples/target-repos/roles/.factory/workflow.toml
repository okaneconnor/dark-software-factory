# The roles kit workflow. It is the built-in workflow with two changes: the
# single review is split into a scope review (did it do exactly what was
# asked?) and a quality review (is it good code?), and fix gets one more
# visit because either reviewer can send work back to it. A review that runs
# out of visits publishes, as in the built-in workflow.
version = 1
start = "plan"

[stages.plan]
kind = "agent"
mode = "read"
prompt = "plan.md.j2"
schema = "plan"
on = { ready = "approve", needs_decision = "@blocked" }

[stages.approve]
kind = "gate"
on = { approved = "implement", rejected = "@blocked" }

[stages.implement]
kind = "agent"
mode = "write"
prompt = "implement.md.j2"
on = { success = "verify", failure = "@blocked" }

# Always runs the .factory/ snapshot taken at the run's base commit.
[stages.verify]
kind = "command"
run = ".factory/verify.sh"
timeout = "30m"
network = "none"
max_visits = 5
on = { success = "scope_review", failure = "fix" }

# Fresh context, read-only. Compares the diff with the issue and the plan.
[stages.scope_review]
kind = "agent"
mode = "read"
prompt = "scope-review.md.j2"
schema = "review"
max_visits = 2
on = { approve = "quality_review", changes_requested = "fix" }
exhausted = "@publish"

# Fresh context, read-only. Judges the code itself.
[stages.quality_review]
kind = "agent"
mode = "read"
prompt = "quality-review.md.j2"
schema = "review"
max_visits = 2
on = { approve = "@publish", changes_requested = "fix" }
exhausted = "@publish"

# Gets the verify output or the findings of whichever review last asked for
# changes.
[stages.fix]
kind = "agent"
mode = "write"
prompt = "fix.md.j2"
max_visits = 4
on = { success = "verify", failure = "@blocked" }
