# Example dsf configuration, normally installed as /etc/dsf/config.toml.
# Every value below is a placeholder. Secrets never go in this file: the
# Claude token, the GitHub App's private key and the digest webhook are
# separate files (see docs/design.md).
# Check a config with `dsf config validate <file>`.

# IANA time zone for the window, `dsf status` and the digest. When the
# digest goes out is dsf-digest.timer's setting.
timezone = "Europe/London"

# Parallel runs, 1 or 2.
workers = 1

# New work starts only inside this local-time window. Running work finishes.
window = { start = "23:00", end = "07:00" }

# How long a posted plan waits for factory:plan-approved before blocking.
approval_expiry = "3d"

# Percent of your weekly Claude allowance the factory may use. Past it, no
# new Claude stage starts and paused runs carry on after the weekly reset,
# leaving the rest for your own work. 100 leaves it to the real limit.
weekly_usage_cap = 80

state_dir = "/var/lib/dsf"

# No run starts or continues while the state directory's disk has less free
# space than this, in GB. `dsf doctor` fails below it too.
min_free_disk_gb = 5

# How long a finished run's files (its clone, worktree and logs) stay on
# disk. Its record, and the branch it pushed, stay for good.
run_retention = "14d"

[github]
# Issues are picked up only when both the author and whoever added
# factory:ready are listed here.
allowed_users = ["your-github-login"]
# The GitHub App dsf acts as: create one with Contents, Issues and Pull
# requests read/write, install it on the repos below only, and put its App
# ID here. Its private key is a separate file, never this one.
app_id = 123456

[[repos]]
name = "your-github-login/example-repo"
# never | label (only issues labelled factory:approve-plan) | always.
# An issue that needs approval can't use a repo workflow without a gate stage.
approval = "label"
# Standards packs for this repo's agents, by directory name under
# [packs] dir. See examples/packs/.
packs = []

[caps]
# Upper bounds on what a repo's .factory/workflow.toml may ask for.
max_visits = 5
command_timeout = "60m"
max_stages = 16

[egress]
# Hosts agent containers may reach through the proxy, in addition to the
# Anthropic API. Typically your package registries; Terraform repos need
# "registry.terraform.io" and "releases.hashicorp.com".
allow = ["registry.npmjs.org", "pypi.org", "files.pythonhosted.org", "index.crates.io", "static.crates.io"]

[images]
# Pin both by the digests in the release notes, e.g.
# "ghcr.io/okaneconnor/dsf-worker@sha256:...".
worker = "ghcr.io/your-github-login/dsf-worker:v0.1.0"
# dsf's own image, which the egress proxy sidecar runs.
dsf = "ghcr.io/your-github-login/dsf:v0.1.0"

[packs]
# Where standards packs live: one Claude Code plugin directory per pack,
# each optionally with a rules.md. Needed only if a repo names packs.
# dir = "/etc/dsf/packs"

[protect]
# Paths agents may not change, in addition to .factory/, .github/,
# .claude/ and .mcp.json.
extra = []
