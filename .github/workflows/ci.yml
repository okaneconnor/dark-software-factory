name: CI

on:
  pull_request:
  push:
    branches: [main]

# Read-only token: CI never writes to the repo, and it holds no secrets —
# in particular no Claude token, ever (this repo is public).
permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  verify:
    name: verify
    runs-on: ubuntu-latest
    steps:
      # Actions are pinned to full commit SHAs (tag in the comment) so a moved
      # tag cannot change what runs here.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # Installs exactly the toolchain and components in rust-toolchain.toml.
      - run: rustup toolchain install
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      # The same gate the factory applies to its own pull requests. The
      # runner has Docker, so the container tests run here too; inside the
      # factory's own verify container (no Docker) they skip.
      - run: .factory/verify.sh
        env:
          DSF_DOCKER_TESTS: "1"

  deny:
    name: cargo-deny
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: EmbarkStudios/cargo-deny-action@3c6349835b2b7b196a839186cb8b78e02f7b5f25 # v2.1.1
        with:
          command: check
