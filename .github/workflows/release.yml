name: Release

# Pushing a tag like v0.2.0 publishes a release: a static x86_64 Linux
# binary with its checksum, and the dsf and worker images on GHCR, whose
# digests the release notes list for pinning. Pull requests that touch the
# packaging build the same artefacts and publish nothing.
on:
  push:
    tags: ["v*"]
  pull_request:
    paths:
      - .github/workflows/release.yml
      - docker/**
      - worker/**
      - Cargo.lock
      - rust-toolchain.toml

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  TARGET: x86_64-unknown-linux-musl
  VERSION: ${{ github.event_name == 'push' && github.ref_name || 'dev' }}

jobs:
  build:
    name: build
    runs-on: ubuntu-latest
    steps:
      # Pinned to full commit SHAs, as in ci.yml.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: rustup toolchain install && rustup target add "$TARGET"
      - run: sudo apt-get update && sudo apt-get install -y --no-install-recommends musl-tools
      - name: The tag matches the crate version
        if: github.event_name == 'push'
        run: |
          version=$(cargo metadata --no-deps --format-version 1 \
            | jq -r '.packages[] | select(.name == "dsf") | .version')
          if [ "v$version" != "$VERSION" ]; then
            echo "tag $VERSION doesn't match dsf $version in Cargo.toml" >&2
            exit 1
          fi
      - name: Static binary
        run: cargo build --release --locked --target "$TARGET" --package dsf --bin dsf
        env:
          CC_x86_64_unknown_linux_musl: musl-gcc
      - name: Package
        run: |
          name="dsf-$VERSION-$TARGET"
          mkdir -p "dist/$name"
          cp "target/$TARGET/release/dsf" LICENSE "dist/$name/"
          cp -R examples/packs "dist/$name/packs"
          file "dist/$name/dsf" | tee /dev/stderr | grep -Eq 'statically linked|static-pie linked'
          "dist/$name/dsf" --version
          tar -C dist -czf "dist/$name.tar.gz" "$name"
          (cd dist && sha256sum "$name.tar.gz" > "$name.tar.gz.sha256")
          cp "target/$TARGET/release/dsf" docker/dsf
      # Built here so a broken Dockerfile fails the pull request, not the
      # release. Nothing is pushed from this job.
      - name: Images
        run: |
          docker build --tag dsf:release --file docker/release.Dockerfile docker
          docker run --rm dsf:release --version
          docker build --tag dsf-worker:release worker
          docker run --rm dsf-worker:release claude --version
          docker run --rm dsf-worker:release terraform version
          docker run --rm dsf-worker:release tflint --version
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release
          path: dist/*.tar.gz*
          if-no-files-found: error

  publish:
    name: publish
    needs: build
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release
          path: dist
      - name: Push the images
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          owner="${GITHUB_REPOSITORY_OWNER,,}"
          tar -xzf "dist/dsf-$VERSION-$TARGET.tar.gz" -C dist
          cp "dist/dsf-$VERSION-$TARGET/dsf" docker/dsf
          echo "$GH_TOKEN" | docker login ghcr.io --username "$GITHUB_ACTOR" --password-stdin
          labels=(
            --label "org.opencontainers.image.source=https://github.com/$GITHUB_REPOSITORY"
            --label "org.opencontainers.image.version=$VERSION"
            --label "org.opencontainers.image.licenses=MIT"
          )
          docker build "${labels[@]}" --tag "ghcr.io/$owner/dsf:$VERSION" --file docker/release.Dockerfile docker
          docker build "${labels[@]}" --tag "ghcr.io/$owner/dsf-worker:$VERSION" worker
          for image in dsf dsf-worker; do
            docker push "ghcr.io/$owner/$image:$VERSION"
            docker inspect --format '{{index .RepoDigests 0}}' "ghcr.io/$owner/$image:$VERSION" \
              > "dist/$image.digest"
          done
          docker logout ghcr.io
      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          claude=$(sed -n 's/^ARG CLAUDE_CODE_VERSION=//p' worker/Dockerfile)
          {
            echo "## Install"
            echo
            echo "Download \`dsf-$VERSION-$TARGET.tar.gz\` and check it against its \`.sha256\` file, then put \`dsf\` in \`/usr/local/bin\`."
            echo
            echo "## Images"
            echo
            echo "Pin these digests in the config's \`[images]\`:"
            echo
            echo "- dsf (the egress proxy sidecar): \`$(cat dist/dsf.digest)\`"
            echo "- worker (Claude Code $claude): \`$(cat dist/dsf-worker.digest)\`"
          } > dist/notes.md
          gh release create "$VERSION" --verify-tag --title "dsf $VERSION" --notes-file dist/notes.md \
            "dist/dsf-$VERSION-$TARGET.tar.gz" "dist/dsf-$VERSION-$TARGET.tar.gz.sha256"
