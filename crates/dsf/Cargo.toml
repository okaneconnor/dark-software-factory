[package]
name = "dsf"
description = "A dark software factory: turns approved GitHub issues into verified draft pull requests."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[lints]
workspace = true

[dependencies]
anyhow = "1.0.104"
base64 = "0.23.1"
clap = { version = "4.6.7", features = ["derive"] }
dsf-core = { path = "../dsf-core" }
jiff = "0.2.38"
secrecy = "0.10.3"
thiserror = "2.0.21"
tokio = { version = "1.53.3", features = ["macros", "rt-multi-thread", "process", "time", "fs", "io-util", "sync"] }

[dev-dependencies]
assert_cmd = "2.2.2"
insta = "1.49.0"
tempfile = "3.27.0"
